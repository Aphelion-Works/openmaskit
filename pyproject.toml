# Modified in the unofficial fork: reusable privacy checks and maintained privacy fixes.
[project]
name = "openmaskit"
version = "0.6.1+privacy.9"
description = "Drop-in MCP proxy that keeps your secrets out of the context window"
readme = "README.md"
authors = [
    { name = "Amin Malekloo", email = "openmaskit@maskitmcp.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["mcp", "proxy", "security", "data-masking", "ai", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp[cli]>=1.30.0,<2",
    # 1.4+ FileResponse waits for client disconnect and stalls httpx's ASGI transport.
    "starlette>=1.3.1,<1.4",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "anyio>=4.14.2",
    "cryptography>=50.0.0",  # For OAuth token encryption
    "pyahocorasick>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/ricardomartins-gravitee/openmaskit"
Repository = "https://github.com/ricardomartins-gravitee/openmaskit"
Issues = "https://github.com/ricardomartins-gravitee/openmaskit/issues"

[project.scripts]
openmaskit = "openmaskit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmaskit"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude",
    ".codegraph",
    ".coverage",
    "coverage.json",
    "bench_unmask.py",
    "CLAUDE.md",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
]
e2e = [
    "pytest>=8.0",
    "pytest-playwright>=0.5.0",
]

[tool.uv]
constraint-dependencies = [
    "certifi>=2026.10.18",
    "idna>=3.15",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.31",
    "urllib3>=2.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end browser tests (real OpenMaskit subprocess + Playwright); excluded from default run, see tests/e2e/README.md",
]
addopts = "-m 'not e2e'"
